{% extends "base.html" %}
{% block title %}Analysis History — TalentLens{% endblock %}

{% block content %}
<div class="container">
  <div class="mt-3 mb-3">
    <a class="btn btn-ghost btn-sm" href="{{ url_for('home') }}">&larr; Home</a>
  </div>

  <header class="page-head">
    <h1>Analysis History</h1>
    <p>Your previous resume analyses</p>
  </header>

  <!-- History will be populated by JavaScript -->
  <section class="card" id="history-section">
    <div class="alert alert-info" id="history-empty-message">
      <span class="icon">&#128221;</span><span>No analysis history yet. Complete an analysis to see it appear here.</span>
    </div>
    <div class="history-list" id="history-list-container">
      <!-- History items will be inserted here by JavaScript -->
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  // Load history from localStorage
  var history = JSON.parse(localStorage.getItem('talentlens-history') || '[]');
  
  var historyListContainer = document.getElementById('history-list-container');
  var emptyMessage = document.getElementById('history-empty-message');
  
  if (history.length === 0) {
    emptyMessage.style.display = 'block';
    return;
  }
  
  emptyMessage.style.display = 'none';
  historyListContainer.innerHTML = '';
  
  history.forEach(function (entry) {
    var hasPdf = entry.pdf_file_id && entry.pdf_file_id.length > 0;
    var dateStr = new Date(entry.timestamp).toLocaleString(undefined, { 
      month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' 
    });
    
    var historyItem = document.createElement('div');
    historyItem.className = 'history-item';
    historyItem.innerHTML = 
      '<div class="history-header">' +
        '<div class="history-info">' +
          '<h3 class="history-title">Analysis from ' + escapeHtml(dateStr) + '</h3>' +
          (entry.pdf_filename ? '<div class="history-pdf-name">&#128196; ' + escapeHtml(entry.pdf_filename) + '</div>' : '') +
          '<div class="history-meta">' +
            '<span class="score-badge">' +
              (entry.overall_score !== null ? entry.overall_score + '% Match' : 'N/A') +
            '</span>' +
            (entry.skill_match !== null ? '<span class="skill-badge">' + entry.skill_match + '% Skills Match</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="history-actions">' +
          '<button type="button" class="btn btn-sm btn-outline history-load" data-token="' + escapeHtml(entry.token) + '">' +
            'Load Analysis' +
          '</button>' +
          (hasPdf ?
            '<a class="btn btn-sm btn-outline history-view-pdf" href="/api/pdf/' + escapeHtml(entry.pdf_file_id) + '" target="_blank" rel="noopener noreferrer">' +
              'View PDF' +
            '</a>' +
            '<a class="btn btn-sm btn-outline history-download-pdf" href="/api/pdf/' + escapeHtml(entry.pdf_file_id) + '/download?name=' + encodeURIComponent(entry.pdf_filename || 'resume.pdf') + '">' +
              'Download PDF' +
            '</a>'
          :
            '<span class="btn btn-sm btn-outline history-no-pdf" title="Original PDF not available">PDF unavailable</span>'
          ) +
          '<button type="button" class="btn btn-sm btn-link history-delete" data-id="' + entry.id + '"' + (hasPdf ? ' data-pdf-id="' + escapeHtml(entry.pdf_file_id) + '"' : '') + '>' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
              '<line x1="18" y1="6" x2="6" y2="18"></line>' +
              '<line x1="6" y1="6" x2="18" y2="18"></line>' +
            '</svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="history-content">' +
        '<div class="history-preview">' +
          '<h4>Resume Preview:</h4>' +
          '<p class="history-text">' + escapeHtml(entry.resume_excerpt || 'No preview available') + '</p>' +
        '</div>' +
        '<div class="history-preview">' +
          '<h4>Job Description Preview:</h4>' +
          '<p class="history-text">' + escapeHtml(entry.job_excerpt || 'No preview available') + '</p>' +
        '</div>' +
      '</div>';
    
    historyListContainer.appendChild(historyItem);
  });
  
  // Handle loading history items
  document.querySelectorAll('.history-load').forEach(function (button) {
    button.addEventListener('click', function () {
      var token = this.getAttribute('data-token');
      if (token) {
        fetch('/api/analysis?token=' + encodeURIComponent(token))
          .then(function (response) {
            if (response.ok) {
              window.location.href = '/results?token=' + encodeURIComponent(token);
            } else {
              if (confirm('This analysis has expired. Would you like to go to the analyze page to create a new one?')) {
                window.location.href = '/analyze';
              }
            }
          })
          .catch(function () {
            if (confirm('Unable to load this analysis (may have expired). Would you like to go to the analyze page to create a new one?')) {
              window.location.href = '/analyze';
            }
          });
      }
    });
  });
  
  // Handle deleting history items
  document.querySelectorAll('.history-delete').forEach(function (button) {
    button.addEventListener('click', function () {
      var id = parseInt(this.getAttribute('data-id'));
      var pdfId = this.getAttribute('data-pdf-id');
      if (confirm('Are you sure you want to delete this history item?')) {
        // Delete the PDF from server if it exists
        if (pdfId) {
          fetch('/api/pdf/' + encodeURIComponent(pdfId), { method: 'DELETE' });
        }
        
        var history = JSON.parse(localStorage.getItem('talentlens-history') || '[]');
        var filtered = history.filter(function (item) { return item.id !== id; });
        localStorage.setItem('talentlens-history', JSON.stringify(filtered));
        this.closest('.history-item').remove();
        
        var countBadge = document.querySelector('.history-count');
        if (countBadge) {
          var newCount = filtered.length;
          if (newCount > 0) {
            countBadge.textContent = newCount;
          } else {
            countBadge.remove();
          }
        }
        
        if (filtered.length === 0) {
          location.reload();
        }
      }
    });
  });
  
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }
});
</script>
<style>
  .history-list {
    display: grid;
    gap: 1.5rem;
  }
  .history-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-card);
  }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 1.5rem;
    background: var(--bg-muted);
    border-bottom: 1px solid var(--border);
  }
  .history-info {
    flex: 1;
  }
  .history-title {
    margin: 0 0 0.25rem 0;
    font-size: 1.15rem;
    color: var(--text);
  }
  .history-pdf-name {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  .history-meta {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .score-badge, .skill-badge {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.25rem 0.75rem;
    font-size: 0.85rem;
    color: var(--text);
    font-weight: 600;
  }
  .history-actions {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    flex-shrink: 0;
    align-items: flex-start;
  }
  .history-no-pdf {
    opacity: 0.5;
    cursor: default;
    pointer-events: none;
    font-size: 0.75rem;
    padding: 0.25rem 0.5rem;
  }
  .history-content {
    padding: 1.5rem;
  }
  .history-preview {
    margin-bottom: 1rem;
  }
  .history-preview:last-child {
    margin-bottom: 0;
  }
  .history-preview h4 {
    margin: 0 0 0.5rem 0;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .history-text {
    margin: 0;
    color: var(--text);
    line-height: 1.6;
    font-size: 0.88rem;
    background: var(--bg);
    padding: 0.75rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    max-height: 100px;
    overflow-y: auto;
  }
  
  @media (max-width: 768px) {
    .history-header {
      flex-direction: column;
      align-items: stretch;
    }
    .history-info {
      margin-bottom: 1rem;
    }
    .history-actions {
      justify-content: flex-start;
    }
  }
</style>
{% endblock %}
